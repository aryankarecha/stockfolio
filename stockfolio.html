<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockfolio — India Portfolio Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #07080d; --dark: #0e1016; --card: #141720; --card2: #191d28;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
      --gold: #d4a847; --gold-light: #f0c96a; --gold-dim: rgba(212,168,71,0.13);
      --green: #3ddc84; --green-dim: rgba(61,220,132,0.1);
      --red: #f05454; --red-dim: rgba(240,84,84,0.1);
      --text: #e8e8f0; --muted: #7a7a9a; --muted2: #3a3a5a;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; overflow-x: hidden; }
    button { font-family: 'Syne', sans-serif; cursor: pointer; border: none; }
    input { font-family: 'Syne', sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--dark); }
    ::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 3px; }

    /* NOISE */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.35;
    }

    /* TICKER */
    .ticker-bar { background: var(--dark); border-bottom: 1px solid var(--border); overflow: hidden; padding: 9px 0; position: sticky; top: 0; z-index: 200; }
    .ticker-track { display: flex; gap: 60px; animation: ticker 55s linear infinite; width: max-content; padding: 0 30px; }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    .ticker-item { display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: nowrap; }
    .ticker-sym { color: var(--gold); font-weight: 600; letter-spacing: 0.5px; }
    .ticker-price { color: var(--text); }
    .ticker-chg.up { color: var(--green); } .ticker-chg.dn { color: var(--red); }
    .ticker-loading { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); padding: 0 24px; animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

    /* NAV */
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 48px; background: rgba(7,8,13,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 37px; z-index: 100; gap: 12px; flex-wrap: wrap; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--gold); display: flex; align-items: center; gap: 10px; }
    .logo-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; animation: blink 2s ease-in-out infinite; }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all .2s; }
    .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .nav-link.active { color: var(--text); background: rgba(255,255,255,0.08); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-badge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gold); background: var(--gold-dim); border: 1px solid rgba(212,168,71,0.25); padding: 5px 12px; border-radius: 100px; letter-spacing: 1px; }
    .refresh-btn { background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid var(--border); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; transition: all .2s; }
    .refresh-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }

    /* LAYOUT */
    .app { min-height: 100vh; }
    .section { max-width: 1280px; margin: 0 auto; padding: 40px 48px 80px; }

    /* BANNERS */
    .error-banner { background: rgba(240,84,84,0.08); border-bottom: 1px solid rgba(240,84,84,0.15); padding: 10px 48px; font-size: 13px; color: var(--red); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .error-banner button { background: rgba(240,84,84,0.15); color: var(--red); border: 1px solid rgba(240,84,84,0.25); padding: 3px 12px; border-radius: 5px; font-size: 12px; transition: all .2s; cursor: pointer; }
    .error-banner button:hover { background: rgba(240,84,84,0.25); }
    .info-bar { text-align: right; padding: 5px 48px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted2); }

    /* DASHBOARD HERO */
    .dash-hero { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--border); gap: 20px; flex-wrap: wrap; }
    .section-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--gold); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 8px; }
    .nav-value { font-family: 'DM Serif Display', serif; font-size: clamp(38px, 5vw, 68px); color: #fff; line-height: 1; letter-spacing: -2px; margin-bottom: 8px; }
    .nav-change { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .nav-change.up { color: var(--green); } .nav-change.dn { color: var(--red); }

    /* STATS GRID */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 28px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; transition: border-color .2s; }
    .stat-card:hover { border-color: var(--border2); }
    .stat-label { font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
    .stat-value { font-family: 'DM Serif Display', serif; font-size: 26px; color: #fff; letter-spacing: -0.5px; line-height: 1; }
    .stat-value.up { color: var(--green); } .stat-value.dn { color: var(--red); }

    /* CARD */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--border); }
    .card-title { font-family: 'DM Serif Display', serif; font-size: 18px; color: #fff; }

    /* SECTION HEADER */
    .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; gap: 16px; flex-wrap: wrap; }
    .section-header h2 { font-family: 'DM Serif Display', serif; font-size: 30px; color: #fff; letter-spacing: -1px; margin-top: 4px; }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { padding: 11px 16px; font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .table td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .table tr:last-child td { border-bottom: none; }
    .table tbody tr { transition: background .15s; }
    .table tbody tr:hover { background: rgba(255,255,255,0.022); }
    .right { text-align: right; }

    /* STOCK CELL */
    .stock-cell { display: flex; align-items: center; gap: 12px; }
    .stock-badge { width: 38px; height: 38px; background: var(--gold-dim); border: 1px solid rgba(212,168,71,0.18); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 8px; font-weight: 600; color: var(--gold); flex-shrink: 0; letter-spacing: 0.3px; }
    .stock-badge.sm { width: 32px; height: 32px; font-size: 7px; }
    .stock-badge.lg { width: 46px; height: 46px; font-size: 9px; border-radius: 12px; }
    .stock-name { font-weight: 600; font-size: 13px; color: var(--text); }
    .stock-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .stock-sector { display: inline-block; font-size: 9px; color: var(--gold); background: var(--gold-dim); padding: 2px 7px; border-radius: 4px; margin-top: 4px; letter-spacing: 0.5px; font-family: 'IBM Plex Mono', monospace; }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    .pct-small { font-size: 10px; margin-top: 2px; }
    .up { color: var(--green); } .dn { color: var(--red); }

    /* TYPE BADGE */
    .type-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 1px; padding: 4px 10px; border-radius: 6px; }
    .type-badge.buy { background: var(--green-dim); color: var(--green); }
    .type-badge.sell { background: var(--red-dim); color: var(--red); }

    /* BUTTONS */
    .btn-primary { background: var(--gold); color: var(--black); padding: 11px 26px; border-radius: 8px; font-weight: 700; font-size: 13px; letter-spacing: 0.3px; transition: all .2s; border: none; }
    .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(212,168,71,0.18); }
    .btn-primary.full { width: 100%; padding: 14px; margin-top: 18px; font-size: 14px; }
    .btn-sell-confirm { background: var(--red); color: #fff; padding: 11px 26px; border-radius: 8px; font-weight: 700; font-size: 13px; transition: all .2s; border: none; }
    .btn-sell-confirm:hover { background: #f36464; transform: translateY(-1px); }
    .btn-sell-confirm.full { width: 100%; padding: 14px; margin-top: 18px; font-size: 14px; }
    .btn-sell-row { background: transparent; color: var(--red); border: 1px solid rgba(240,84,84,0.3); padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; transition: all .2s; }
    .btn-sell-row:hover { background: var(--red-dim); border-color: var(--red); }
    .btn-buy-more { background: transparent; color: var(--green); border: 1px solid rgba(61,220,132,0.3); padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; transition: all .2s; margin-right: 6px; }
    .btn-buy-more:hover { background: var(--green-dim); border-color: var(--green); }
    .btn-chart-row { background: transparent; color: var(--gold); border: 1px solid rgba(212,168,71,0.3); padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; transition: all .2s; margin-right: 6px; }
    .btn-chart-row:hover { background: var(--gold-dim); border-color: var(--gold); }
    .chart-modal { width: 100%; max-width: 720px; }
    .range-tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 8px; border: 1px solid var(--border); }
    .range-tab { background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 6px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; transition: all .15s; border: none; cursor: pointer; }
    .range-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .range-tab.active { background: var(--gold-dim); color: var(--gold); border: 1px solid rgba(212,168,71,0.3); }
    .chart-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
    .chart-stat-box { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .chart-stat-box-label { font-size: 9px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .chart-stat-box-val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; }
    .chart-container { position: relative; width: 100%; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 14px 10px 10px; margin-top: 14px; }
    .chart-hover-info { min-height: 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .clickable-stock { cursor: pointer; transition: opacity .15s; }
    .clickable-stock:hover { opacity: 0.8; }
    .indicator-tag { display: inline-flex; align-items: center; gap: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.5px; }
    .indicator-tag.golden { background: rgba(240,201,106,0.15); color: #f0c96a; border: 1px solid rgba(240,201,106,0.3); }
    .indicator-tag.death { background: rgba(240,84,84,0.15); color: #f05454; border: 1px solid rgba(240,84,84,0.3); }
    .indicator-tag.neutral { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }
    .indicator-panel { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
    .learn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-top: 24px; }
    .learn-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; justify-content: space-between; transition: all .2s; }
    .learn-card:hover { border-color: rgba(212,168,71,0.3); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    .learn-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .learn-title { font-family: 'DM Serif Display', serif; font-size: 24px; color: #fff; margin-bottom: 12px; }
    .learn-desc { font-size: 14px; color: #b8b8cc; line-height: 1.7; margin-bottom: 16px; }
    .learn-analogy { background: rgba(212,168,71,0.08); border-left: 3px solid var(--gold); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 13px; color: #e0d0b0; line-height: 1.6; margin-bottom: 16px; }
    .learn-signals { display: flex; flex-direction: column; gap: 8px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
    .learn-sig-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,0.03); }
    .link-btn { background: transparent; color: var(--gold); border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: color .2s; }
    .link-btn:hover { color: var(--gold-light); }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 90px 40px; }
    .empty-icon { font-size: 52px; margin-bottom: 18px; }
    .empty-state h3 { font-family: 'DM Serif Display', serif; font-size: 26px; color: #fff; margin-bottom: 10px; }
    .empty-state p { font-size: 14px; color: var(--muted); margin-bottom: 28px; line-height: 1.7; max-width: 400px; margin-left: auto; margin-right: auto; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(7,8,13,0.88); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; animation: fadeIn .18s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: slideUp .22s ease; }
    @keyframes slideUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .modal-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: #fff; }
    .modal-close { background: rgba(255,255,255,0.07); color: var(--muted); width: 30px; height: 30px; border-radius: 7px; font-size: 13px; cursor: pointer; transition: all .2s; border: none; }
    .modal-close:hover { background: rgba(255,255,255,0.12); color: var(--text); }

    /* FORM */
    .modal-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none; transition: border-color .2s; margin-bottom: 10px; }
    .modal-input:focus { border-color: rgba(212,168,71,0.5); background: rgba(255,255,255,0.07); }
    .modal-input::placeholder { color: var(--muted); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 10px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; letter-spacing: 1.5px; text-transform: uppercase; }
    .form-group .modal-input { margin-bottom: 0; }

    /* STOCK LIST */
    .stock-list { display: flex; flex-direction: column; gap: 1px; max-height: 340px; overflow-y: auto; margin-top: 4px; }
    .stock-list-item { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 10px; cursor: pointer; transition: background .12s; }
    .stock-list-item:hover { background: rgba(255,255,255,0.06); }
    .sli-info { flex: 1; min-width: 0; }
    .sli-price { text-align: right; flex-shrink: 0; }

    /* SELECTED STOCK */
    .selected-stock { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
    .selected-stock > div:nth-child(2) { flex: 1; min-width: 0; }
    .ltp-line { font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 4px; }

    /* ORDER SUMMARY */
    .order-summary { display: flex; justify-content: space-between; align-items: center; background: var(--gold-dim); border: 1px solid rgba(212,168,71,0.18); border-radius: 10px; padding: 13px 15px; margin: 14px 0; font-size: 13px; }
    .order-val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--gold); font-size: 15px; }
    .order-summary-sell { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; margin: 14px 0; }
    .os-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 13px; }
    .os-label { color: var(--muted); }
    .os-val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
    .os-row.total { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }

    /* ERROR */
    .field-error { background: var(--red-dim); color: var(--red); border: 1px solid rgba(240,84,84,0.2); border-radius: 8px; padding: 9px 13px; font-size: 12px; margin-top: 10px; }

    /* BUDGET */
    .budget-pill { display: flex; align-items: center; gap: 8px; background: rgba(61,220,132,0.08); border: 1px solid rgba(61,220,132,0.2); padding: 5px 14px; border-radius: 100px; cursor: pointer; transition: all .2s; }
    .budget-pill:hover { background: rgba(61,220,132,0.14); border-color: rgba(61,220,132,0.35); }
    .budget-pill-label { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
    .budget-pill-value { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: var(--green); }
    .budget-pill.low { background: rgba(240,84,84,0.08); border-color: rgba(240,84,84,0.2); }
    .budget-pill.low .budget-pill-value { color: var(--red); }
    .budget-pill.low:hover { background: rgba(240,84,84,0.14); border-color: rgba(240,84,84,0.35); }

    .budget-hero { background: linear-gradient(135deg, rgba(61,220,132,0.06) 0%, rgba(212,168,71,0.06) 100%); border: 1px solid rgba(61,220,132,0.15); border-radius: 20px; padding: 36px 40px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .budget-balance-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 10px; }
    .budget-balance-value { font-family: 'DM Serif Display', serif; font-size: clamp(36px, 5vw, 60px); color: var(--green); line-height: 1; letter-spacing: -2px; }
    .budget-balance-value.low { color: var(--red); }
    .budget-balance-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .budget-actions { display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
    .budget-input-row { display: flex; gap: 8px; }
    .budget-input-row .modal-input { margin-bottom: 0; flex: 1; }

    .budget-log { margin-top: 28px; }
    .budget-log-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); font-size: 13px; transition: background .12s; }
    .budget-log-item:last-child { border-bottom: none; }
    .budget-log-item:hover { background: rgba(255,255,255,0.02); }
    .budget-log-left { display: flex; align-items: center; gap: 12px; }
    .budget-log-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

<body>
  <div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'IBM Plex Mono',monospace;color:#7a7a9a;font-size:13px;">Loading Stockfolio…</div></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    /* Removed CATALOG as requested */

    /* Removed ^NSEI and ^BSESN indices to prevent Yahoo Spark endpoint 400 Bad Request errors */
    const TICKER_SYMS = ['RELIANCE.NS','TCS.NS','INFY.NS','HDFCBANK.NS','ICICIBANK.NS','BHARTIARTL.NS','SBIN.NS','ITC.NS','WIPRO.NS','BAJFINANCE.NS','HCLTECH.NS'];

    /* ─── UTILS ─── */
    const fmt = (n) => {
      if (n == null || isNaN(n)) return '—';
      return '₹' + Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };
    const fmtL = (n) => {
      if (n == null || isNaN(n)) return '—';
      const abs = Math.abs(n);
      if (abs >= 1e7) return '₹' + (n/1e7).toFixed(2) + ' Cr';
      if (abs >= 1e5) return '₹' + (n/1e5).toFixed(2) + ' L';
      return fmt(n);
    };
    const fmtPct = (n) => {
      if (n == null || isNaN(n)) return 'ERR';
      return (n >= 0 ? '+' : '') + (n||0).toFixed(2) + '%';
    };
    const fmtDt = (iso) => new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    const sign = (n) => n >= 0 ? '+' : '';

    /* ─── API ─── */
    /* Fetch all symbols from your custom Python backend */
/* Fetch all symbols from your custom Python backend */
/* Fetch all symbols from your custom Python backend */
    async function fetchPrices(symbols) {
      if (!symbols || !symbols.length) return { _liveCount: 0 };
      
      const CHUNK_SIZE = 10;
      const results = {};
      let liveCount = 0;

      for (let i = 0; i < symbols.length; i += CHUNK_SIZE) {
        const chunk = symbols.slice(i, i + CHUNK_SIZE);
        const symStr = chunk.map(encodeURIComponent).join(',');
        
        const localApiUrl = `http://localhost:3000/api/prices?symbols=${symStr}`;

        try {
          const response = await fetch(localApiUrl);
          if (!response.ok) throw new Error('Network response was not ok');
          
          const data = await response.json();
          
          // FIX: Parse the flat v8 Spark structure correctly
          Object.keys(data).forEach(sym => {
            const item = data[sym];
            
            // Check if we have a valid array of closing prices
            if (item && item.close && Array.isArray(item.close)) {
              
              // Filter out any 'null' gaps in the chart data
              const validCloses = item.close.filter(p => p !== null);
              
              if (validCloses.length > 0) {
                // The Last Traded Price (LTP) is the very last item in the array
                const price = validCloses[validCloses.length - 1];
                
                // Get previous close directly from the root object
                const prev = item.previousClose || item.chartPreviousClose || price;
                
                // Calculate P&L
                const change = +(price - prev).toFixed(2);
                const pct = prev ? +(change / prev * 100).toFixed(2) : 0;
                
                results[sym] = { price, change, pct };
                liveCount++;
              }
            }
          });
          
        } catch (e) {
          console.warn(`Chunk ${Math.floor(i/CHUNK_SIZE) + 1} failed:`, e?.message);
        }
      }

      // Ensure every requested symbol gets an entry in the map to prevent UI crashes
      symbols.forEach(sym => {
        if (!results[sym]) results[sym] = { price: null, change: null, pct: null };
      });

      results._liveCount = liveCount;
      return results;
    }

    /* ─── CHART API ─── */
    async function fetchChartData(symbol, range = '1d') {
      const url = `http://localhost:3000/api/chart?symbol=${encodeURIComponent(symbol)}&range=${range}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('Network error fetching chart data');
      const json = await res.json();
      const chartRes = json?.chart?.result?.[0];
      if (!chartRes) throw new Error('No chart data returned from Yahoo Finance');
      
      const timestamps = chartRes.timestamp || [];
      const quotes = chartRes.indicators?.quote?.[0]?.close || [];
      const points = [];
      
      for (let i = 0; i < timestamps.length; i++) {
        const val = quotes[i];
        if (val !== null && val !== undefined && !isNaN(val)) {
          points.push({
            time: timestamps[i] * 1000,
            price: Number(val)
          });
        }
      }
      
      const meta = chartRes.meta || {};
      return { points, meta };
    }

    const fmtChartTime = (timeMs, range) => {
      const d = new Date(timeMs);
      if (range === '1d') {
        return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      }
      if (range === '1w') {
        return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' +
               d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      }
      return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    };

    /* ─── TECHNICAL INDICATORS HELPERS ─── */
    function calculateSMA(points, period) {
      if (!points || points.length < period) return [];
      const result = [];
      let sum = 0;
      for (let i = 0; i < points.length; i++) {
        sum += points[i].price;
        if (i >= period) {
          sum -= points[i - period].price;
        }
        if (i >= period - 1) {
          result.push(Number((sum / period).toFixed(2)));
        } else {
          result.push(null);
        }
      }
      return result;
    }

    function calculateRSI(points, period = 14) {
      if (!points || points.length <= period) return null;
      let gains = 0;
      let losses = 0;
      for (let i = 1; i <= period; i++) {
        const diff = points[i].price - points[i - 1].price;
        if (diff >= 0) gains += diff;
        else losses += Math.abs(diff);
      }
      let avgGain = gains / period;
      let avgLoss = losses / period;

      for (let i = period + 1; i < points.length; i++) {
        const diff = points[i].price - points[i - 1].price;
        const currentGain = diff > 0 ? diff : 0;
        const currentLoss = diff < 0 ? Math.abs(diff) : 0;
        avgGain = (avgGain * (period - 1) + currentGain) / period;
        avgLoss = (avgLoss * (period - 1) + currentLoss) / period;
      }

      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return Math.round((100 - (100 / (1 + rs))) * 10) / 10;
    }

    function detectCrossovers(points, sma50, sma200) {
      if (!points || !sma50 || !sma200) return null;
      let latestCross = null;
      for (let i = 1; i < points.length; i++) {
        const prev50 = sma50[i - 1];
        const prev200 = sma200[i - 1];
        const curr50 = sma50[i];
        const curr200 = sma200[i];
        if (prev50 !== null && prev200 !== null && curr50 !== null && curr200 !== null) {
          if (prev50 <= prev200 && curr50 > curr200) {
            latestCross = { type: 'GOLDEN', index: i, time: points[i].time, price: points[i].price };
          } else if (prev50 >= prev200 && curr50 < curr200) {
            latestCross = { type: 'DEATH', index: i, time: points[i].time, price: points[i].price };
          }
        }
      }
      const last50 = sma50.length ? sma50[sma50.length - 1] : null;
      const last200 = sma200.length ? sma200[sma200.length - 1] : null;
      const currentState = (last50 !== null && last200 !== null) ? (last50 >= last200 ? 'BULLISH' : 'BEARISH') : 'NEUTRAL';
      return { latestCross, currentState, last50, last200 };
    }

    /* ─── STOCK CHART COMPONENT ─── */
    function StockChart({ points, range, showSMA }) {
      const [hoverIdx, setHoverIdx] = useState(null);

      if (!points || points.length === 0) {
        return (
          <div style={{height:'240px',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--muted)',fontFamily:'IBM Plex Mono',fontSize:'12px'}}>
            No price history available for this period.
          </div>
        );
      }

      const startPrice = points[0].price;
      const endPrice = points[points.length - 1].price;
      const periodDiff = endPrice - startPrice;
      const periodPct = startPrice ? (periodDiff / startPrice) * 100 : 0;
      const isUp = periodDiff >= 0;

      const strokeColor = isUp ? '#3ddc84' : '#f05454';
      const gradientId = isUp ? 'chartGradUp' : 'chartGradDn';

      // Technical Indicators for 1Y
      const sma50 = range === '1y' ? calculateSMA(points, 50) : [];
      const sma200 = range === '1y' ? calculateSMA(points, 200) : [];

      const pricesArr = points.map(p => p.price);
      let minP = Math.min(...pricesArr);
      let maxP = Math.max(...pricesArr);
      if (minP === maxP) {
        minP *= 0.99;
        maxP *= 1.01;
      }
      const pSpread = maxP - minP;
      const yMin = minP - pSpread * 0.05;
      const yMax = maxP + pSpread * 0.05;
      const ySpread = yMax - yMin;

      const W = 700;
      const H = 250;
      const padL = 60;
      const padR = 20;
      const padT = 15;
      const padB = 28;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const mapped = points.map((p, i) => {
        const x = padL + (points.length > 1 ? (i / (points.length - 1)) * plotW : plotW / 2);
        const y = padT + plotH - ((p.price - yMin) / ySpread) * plotH;
        return { ...p, x, y };
      });

      const dLine = 'M ' + mapped.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ');
      const dArea = `${dLine} L ${(padL + plotW).toFixed(1)},${(padT + plotH).toFixed(1)} L ${padL.toFixed(1)},${(padT + plotH).toFixed(1)} Z`;

      // Build SMA SVG paths
      let dSMA50 = '';
      let dSMA200 = '';
      if (range === '1y' && showSMA) {
        const pts50 = [];
        const pts200 = [];
        for (let i = 0; i < points.length; i++) {
          const x = padL + (i / (points.length - 1)) * plotW;
          if (sma50[i] !== null) {
            const y = padT + plotH - ((sma50[i] - yMin) / ySpread) * plotH;
            pts50.push(`${x.toFixed(1)},${y.toFixed(1)}`);
          }
          if (sma200[i] !== null) {
            const y = padT + plotH - ((sma200[i] - yMin) / ySpread) * plotH;
            pts200.push(`${x.toFixed(1)},${y.toFixed(1)}`);
          }
        }
        if (pts50.length > 0) dSMA50 = 'M ' + pts50.join(' L ');
        if (pts200.length > 0) dSMA200 = 'M ' + pts200.join(' L ');
      }

      const activePoint = hoverIdx !== null && mapped[hoverIdx] ? mapped[hoverIdx] : mapped[mapped.length - 1];
      const activeDiff = activePoint.price - startPrice;
      const activePct = startPrice ? (activeDiff / startPrice) * 100 : 0;
      const hoverSMA50 = hoverIdx !== null && sma50[hoverIdx] !== null ? sma50[hoverIdx] : null;
      const hoverSMA200 = hoverIdx !== null && sma200[hoverIdx] !== null ? sma200[hoverIdx] : null;

      const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const ratio = (clientX - (padL / W) * rect.width) / ((plotW / W) * rect.width);
        const clampedRatio = Math.max(0, Math.min(1, ratio));
        const idx = Math.round(clampedRatio * (mapped.length - 1));
        setHoverIdx(idx);
      };

      const handleMouseLeave = () => {
        setHoverIdx(null);
      };

      // Y-axis grid markers (4 levels)
      const yGridTicks = [0, 0.33, 0.66, 1].map(r => yMin + r * ySpread);

      // X-axis time marks (4 ticks)
      const xIndices = [0, Math.floor(mapped.length * 0.33), Math.floor(mapped.length * 0.66), mapped.length - 1];

      return (
        <div>
          <div className="chart-hover-info">
            <div>
              <span style={{color:'var(--muted)',marginRight:'6px'}}>Time:</span>
              <span style={{color:'var(--text)',fontWeight:600}}>{fmtChartTime(activePoint.time, range)}</span>
              {showSMA && hoverSMA50 !== null && (
                <span style={{marginLeft:'10px',color:'#f0c96a',fontSize:'11px'}}>SMA50: {fmt(hoverSMA50)}</span>
              )}
              {showSMA && hoverSMA200 !== null && (
                <span style={{marginLeft:'8px',color:'#64b5f6',fontSize:'11px'}}>SMA200: {fmt(hoverSMA200)}</span>
              )}
            </div>
            <div>
              <span style={{color:'var(--muted)',marginRight:'6px'}}>Price:</span>
              <span style={{color:'var(--text)',fontWeight:700,fontSize:'14px',marginRight:'8px'}}>{fmt(activePoint.price)}</span>
              <span className={activeDiff >= 0 ? 'up' : 'dn'}>
                {sign(activeDiff)}{fmt(activeDiff)} ({fmtPct(activePct)})
              </span>
            </div>
          </div>

          <div
            className="chart-container"
            onMouseMove={handleMouseMove}
            onMouseLeave={handleMouseLeave}
            style={{cursor:'crosshair'}}
          >
            <svg
              viewBox={`0 0 ${W} ${H}`}
              style={{width:'100%',height:'auto',display:'block',overflow:'visible'}}
            >
              <defs>
                <linearGradient id="chartGradUp" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#3ddc84" stopOpacity="0.28" />
                  <stop offset="100%" stopColor="#3ddc84" stopOpacity="0.0" />
                </linearGradient>
                <linearGradient id="chartGradDn" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#f05454" stopOpacity="0.28" />
                  <stop offset="100%" stopColor="#f05454" stopOpacity="0.0" />
                </linearGradient>
              </defs>

              {/* Horizontal grid lines and Y-axis labels */}
              {yGridTicks.map((priceVal, idx) => {
                const yPos = padT + plotH - ((priceVal - yMin) / ySpread) * plotH;
                return (
                  <g key={idx}>
                    <line
                      x1={padL}
                      y1={yPos}
                      x2={padL + plotW}
                      y2={yPos}
                      stroke="rgba(255,255,255,0.06)"
                      strokeDasharray="4 4"
                    />
                    <text
                      x={padL - 8}
                      y={yPos + 3}
                      fill="var(--muted)"
                      fontSize="9"
                      fontFamily="'IBM Plex Mono', monospace"
                      textAnchor="end"
                    >
                      {priceVal >= 1000 ? Math.round(priceVal) : priceVal.toFixed(1)}
                    </text>
                  </g>
                );
              })}

              {/* Area fill */}
              <path d={dArea} fill={`url(#${gradientId})`} />

              {/* Line stroke */}
              <path
                d={dLine}
                fill="none"
                stroke={strokeColor}
                strokeWidth="2.2"
                strokeLinecap="round"
                strokeLinejoin="round"
              />

              {/* 50-Day SMA Line */}
              {showSMA && dSMA50 && (
                <path
                  d={dSMA50}
                  fill="none"
                  stroke="#f0c96a"
                  strokeWidth="1.8"
                  strokeDasharray="5 3"
                />
              )}

              {/* 200-Day SMA Line */}
              {showSMA && dSMA200 && (
                <path
                  d={dSMA200}
                  fill="none"
                  stroke="#64b5f6"
                  strokeWidth="1.8"
                />
              )}

              {/* X-axis time labels */}
              {xIndices.map((ptIdx, i) => {
                const pt = mapped[ptIdx];
                if (!pt) return null;
                const anchor = i === 0 ? 'start' : (i === xIndices.length - 1 ? 'end' : 'middle');
                let labelText = '';
                const d = new Date(pt.time);
                if (range === '1d') {
                  labelText = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
                } else if (range === '1w') {
                  labelText = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric' });
                } else {
                  labelText = d.toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
                }

                return (
                  <text
                    key={i}
                    x={pt.x}
                    y={padT + plotH + 18}
                    fill="var(--muted)"
                    fontSize="9"
                    fontFamily="'IBM Plex Mono', monospace"
                    textAnchor={anchor}
                  >
                    {labelText}
                  </text>
                );
              })}

              {/* Hover guide & point */}
              {hoverIdx !== null && activePoint && (
                <g>
                  <line
                    x1={activePoint.x}
                    y1={padT}
                    x2={activePoint.x}
                    y2={padT + plotH}
                    stroke="rgba(255,255,255,0.25)"
                    strokeDasharray="3 3"
                  />
                  <circle
                    cx={activePoint.x}
                    cy={activePoint.y}
                    r="5"
                    fill={strokeColor}
                    stroke="#07080d"
                    strokeWidth="2"
                  />
                  <circle
                    cx={activePoint.x}
                    cy={activePoint.y}
                    r="9"
                    fill="none"
                    stroke={strokeColor}
                    strokeOpacity="0.4"
                    strokeWidth="1.5"
                  />
                </g>
              )}
            </svg>
          </div>

          {/* Chart Legend */}
          {range === '1y' && showSMA && (
            <div style={{display:'flex',gap:'16px',justifyContent:'center',alignItems:'center',marginTop:'10px',fontSize:'11px',fontFamily:'IBM Plex Mono'}}>
              <span style={{color:strokeColor}}>— Price Line</span>
              <span style={{color:'#f0c96a'}}>--- 50-Day SMA</span>
              <span style={{color:'#64b5f6'}}>— 200-Day SMA</span>
            </div>
          )}
        </div>
      );
    }

    /* ─── STOCK CHART MODAL ─── */
    function StockChartModal({ stock, prices, onClose, onNavigateLearn }) {
      const [range, setRange] = useState('1d'); // '1d', '1w', '1y'
      const [showSMA, setShowSMA] = useState(true);
      const [chartData, setChartData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const loadChart = useCallback(async (r) => {
        setLoading(true);
        setError(null);
        try {
          const data = await fetchChartData(stock.symbol, r);
          setChartData(data);
        } catch (err) {
          console.error('Failed to load chart:', err);
          setError(err?.message || 'Failed to load chart');
        } finally {
          setLoading(false);
        }
      }, [stock.symbol]);

      useEffect(() => {
        loadChart(range);
      }, [range, loadChart]);

      const livePriceInfo = prices[stock.symbol] || null;
      const points = chartData?.points || [];

      let highPrice = null;
      let lowPrice = null;
      let startPrice = null;
      let endPrice = null;
      let periodChange = null;
      let periodChangePct = null;

      if (points.length > 0) {
        startPrice = points[0].price;
        endPrice = points[points.length - 1].price;
        highPrice = Math.max(...points.map(p => p.price));
        lowPrice = Math.min(...points.map(p => p.price));
        periodChange = endPrice - startPrice;
        periodChangePct = startPrice ? (periodChange / startPrice) * 100 : 0;
      }

      // Technical Indicators for 1Y
      const sma50 = range === '1y' ? calculateSMA(points, 50) : [];
      const sma200 = range === '1y' ? calculateSMA(points, 200) : [];
      const rsi = range === '1y' ? calculateRSI(points, 14) : null;
      const crossovers = range === '1y' ? detectCrossovers(points, sma50, sma200) : null;

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal chart-modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div style={{display:'flex',alignItems:'center',gap:'12px'}}>
                <div className="stock-badge lg">{stock.ds ? stock.ds.slice(0, 4) : stock.symbol.slice(0, 4)}</div>
                <div>
                  <div className="modal-title" style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    {stock.ds || stock.symbol}
                    {stock.exchange && (
                      <span style={{fontSize:'10px',color:'var(--muted)',fontFamily:'IBM Plex Mono',background:'rgba(255,255,255,0.06)',padding:'2px 7px',borderRadius:'4px'}}>
                        {stock.exchange}
                      </span>
                    )}
                  </div>
                  <div style={{fontSize:'12px',color:'var(--muted)',marginTop:'2px'}}>{stock.name || stock.symbol}</div>
                </div>
              </div>
              <button className="modal-close" onClick={onClose}>✕</button>
            </div>

            {/* Price & Range selector row */}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:'14px',flexWrap:'wrap',gap:'12px'}}>
              <div>
                <div style={{fontSize:'9px',fontFamily:'IBM Plex Mono',color:'var(--muted)',letterSpacing:'1.5px',textTransform:'uppercase',marginBottom:'4px'}}>Current Market Price</div>
                <div style={{display:'flex',alignItems:'baseline',gap:'10px'}}>
                  <span style={{fontFamily:'DM Serif Display',fontSize:'28px',color:'#fff'}}>
                    {livePriceInfo && livePriceInfo.price !== null ? fmt(livePriceInfo.price) : (endPrice !== null ? fmt(endPrice) : '—')}
                  </span>
                  {livePriceInfo && livePriceInfo.pct !== null && (

              <div className="chart-stat-box">

                    <span style={{fontFamily:'IBM Plex Mono',fontSize:'10px',color:'var(--gold)',letterSpacing:'1px',textTransform:'uppercase',fontWeight:600}}>
                      ⚡ Technical Indicators (1Y)
                    </span>
                    {crossovers?.latestCross?.type === 'GOLDEN' && (
                      <span className="indicator-tag golden">🌟 Golden Cross</span>
                    )}
                    {crossovers?.latestCross?.type === 'DEATH' && (
                      <span className="indicator-tag death">⚠️ Death Cross</span>
                    )}
                    {!crossovers?.latestCross && crossovers?.currentState === 'BULLISH' && (
                      <span className="indicator-tag golden">{"✦ 50-SMA > 200-SMA"}</span>
                    )}
                    {!crossovers?.latestCross && crossovers?.currentState === 'BEARISH' && (
                      <span className="indicator-tag death">{"✦ 50-SMA < 200-SMA"}</span>
                    )}
                  </div>
                  <label style={{display:'flex',alignItems:'center',gap:'6px',fontSize:'11px',fontFamily:'IBM Plex Mono',color:'var(--muted)',cursor:'pointer'}}>
                    <input type="checkbox" checked={showSMA} onChange={e => setShowSMA(e.target.checked)} />
                    {"Show 50 & 200 SMA"}
                  </label>
                </div>

                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'12px',fontSize:'12px',fontFamily:'IBM Plex Mono'}}>
                  <div>
                    <span style={{color:'var(--muted)',marginRight:'6px'}}>RSI (14D):</span>
                    {rsi !== null ? (
                      <span style={{fontWeight:600,color: rsi >= 70 ? 'var(--red)' : rsi <= 30 ? 'var(--green)' : 'var(--text)'}}>
                        {rsi} {rsi >= 70 ? '· Overbought (>70)' : rsi <= 30 ? '· Oversold (<30)' : '· Normal (30-70)'}
                      </span>
                    ) : '—'}
                  </div>
                  {crossovers?.latestCross && (
                    <div style={{color:'var(--muted)',fontSize:'11px'}}>
                      Latest Crossover: <strong style={{color:'var(--text)'}}>{crossovers.latestCross.type === 'GOLDEN' ? 'Golden Cross' : 'Death Cross'}</strong> on {fmtChartTime(crossovers.latestCross.time, '1y')} @ {fmt(crossovers.latestCross.price)}
                    </div>
                  )}
                  {onNavigateLearn && (
                    <button
                      className="link-btn"
                      onClick={() => { onClose(); onNavigateLearn(); }}

                      📘 How to read these? (Learn Guide) →
                    </button>
                  )}

              </div>
            )}

            {/* Chart Area */}
            {loading && (
              <div style={{height:'260px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'10px',background:'rgba(255,255,255,0.02)',borderRadius:'12px',border:'1px solid var(--border)'}}>
                <div style={{fontFamily:'IBM Plex Mono',fontSize:'13px',color:'var(--gold)',animation:'blink 1.2s infinite'}}>
                  ◆ Loading {range.toUpperCase()} chart data…
                </div>
              </div>
            )}

            {!loading && error && (
              <div style={{height:'260px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'12px',background:'rgba(240,84,84,0.04)',borderRadius:'12px',border:'1px solid rgba(240,84,84,0.2)',padding:'20px',textAlign:'center'}}>
                <div style={{fontSize:'13px',color:'var(--red)'}}>Failed to load stock chart data from backend.</div>
                <div style={{fontSize:'11px',color:'var(--muted)',fontFamily:'IBM Plex Mono'}}>{error}</div>
                <button className="btn-primary" style={{padding:'8px 18px',fontSize:'12px'}} onClick={() => loadChart(range)}>↻ Retry</button>
              </div>

            {!loading && !error && (
              <StockChart points={points} range={range} showSMA={showSMA} meta={chartData?.meta} />

    /* ─── TICKER BAR ─── */
    function TickerBar({ prices, loading, holdings }) {
      const portfolioSyms = holdings ? holdings.map(h => h.symbol) : [];
      const combinedSyms = [...new Set([...TICKER_SYMS, ...portfolioSyms])];

      const items = combinedSyms.map(sym => {
        const p = prices[sym] || { price: null, change: null, pct: null };
        // Since CATALOG is gone, we dynamically generate a clean display name
        let display = sym.replace('.NS', '').replace('.BO', ''); 
        return { sym, display, ...p };
      });

      if (!items.length)
        return <div className="ticker-bar"><div className="ticker-loading">{loading ? '◆ Connecting to backend feed…' : '◆ Market data unavailable — check connection'}</div></div>;

      const doubled = [...items, ...items];
      return (
        <div className="ticker-bar">
          <div className="ticker-track">
            {doubled.map((item, i) => (
              <div key={i} className="ticker-item">
                <span className="ticker-sym">{item.display}</span>
                <span className="ticker-price">{item.price !== null ? fmt(item.price) : '—'}</span>
                <span className={`ticker-chg ${(item.pct||0) >= 0 ? 'up' : 'dn'}`}>{item.pct !== null ? fmtPct(item.pct) : 'ERR'}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ─── NAVBAR ─── */
    function NavBar({ view, setView, onRefresh, lastUpdated, loading, budget }) {
      const isLow = budget < 10000;
      return (
        <nav>
          <div className="logo"><div className="logo-dot"/><span>Stockfolio</span></div>
          <div className="nav-links">
            {['dashboard','holdings','transactions','budget','learn'].map(v => (
              <button key={v} className={`nav-link${view===v?' active':''}`} onClick={() => setView(v)}>
                {v === 'learn' ? '📘 Learn' : v[0].toUpperCase()+v.slice(1)}
              </button>
            ))}
          </div>
          <div className="nav-right">
            {lastUpdated && (
              <button className="refresh-btn" onClick={onRefresh} disabled={loading}>
                {loading ? '⟳ Refreshing…' : `⟳ ${lastUpdated.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`}
              </button>
            )}
            <div className={`budget-pill${isLow?' low':''}`} onClick={() => setView('budget')} title="Click to manage budget">
              <div className="budget-pill-label">Balance</div>
              <div className="budget-pill-value">{fmtL(budget)}</div>
            </div>
            <div className="nav-badge">NSE · LIVE</div>
          </div>
        </nav>
      );
    }

    /* ─── DASHBOARD ─── */
    function Dashboard({ holdings, transactions, prices, pricesLoaded, onBuy, setView, budget, onOpenChart }) {
      const totalInvested = holdings.reduce((a,h) => a + h.qty*h.avgBuy, 0);
      const currentValue  = holdings.reduce((a,h) => {
        const cp = prices[h.symbol]?.price;
        return a + h.qty*(cp !== null && cp !== undefined ? cp : h.avgBuy);
      }, 0);
      const unrealPnL = currentValue - totalInvested;
      const unrealPct = totalInvested > 0 ? (unrealPnL/totalInvested)*100 : 0;
      const realPnL   = transactions.filter(t=>t.type==='SELL').reduce((a,t)=>a+(t.rPnL||0),0);

      const top = [...holdings].map(h => {
        const cp = prices[h.symbol]?.price ?? null;
        const cv = cp !== null ? h.qty * cp : null;
        const pnl = cp !== null ? h.qty * (cp - h.avgBuy) : null;
        const pnlPct = cp !== null ? (cp - h.avgBuy) / h.avgBuy * 100 : null;
        return { ...h, cp, cv, pnl, pnlPct, chgPct: prices[h.symbol]?.pct ?? null };
      }).sort((a,b)=>(b.cv||0)-(a.cv||0)).slice(0,5);

      const totalCV = top.reduce((a,h)=>a+(h.cv||0),0)||1;

      return (
        <div className="section">
          <div className="dash-hero">
            <div>
              <div className="section-tag">// NET ASSET VALUE · NSE INDIA</div>
              <div className="nav-value">{holdings.length ? (pricesLoaded ? fmtL(currentValue) : fmtL(totalInvested)) : '₹0.00'}</div>
              {holdings.length > 0 && pricesLoaded && (
                <div className={`nav-change ${unrealPnL>=0?'up':'dn'}`}>
                  {unrealPnL>=0?'▲':'▼'} {fmt(Math.abs(unrealPnL))} unrealised ({fmtPct(unrealPct)}) &nbsp;·&nbsp; Total P&amp;L: {sign(unrealPnL+realPnL)}{fmtL(unrealPnL+realPnL)}
                </div>
              )}
            </div>
            <button className="btn-primary" onClick={onBuy}>+ Buy Stock</button>
          </div>

          <div className="stats-grid" style={{gridTemplateColumns:'repeat(5,1fr)'}}>
            <div className="stat-card"><div className="stat-label">Total Invested</div><div className="stat-value">{fmtL(totalInvested)||'₹0.00'}</div></div>
            <div className="stat-card"><div className="stat-label">Current Value</div><div className="stat-value">{pricesLoaded && holdings.length ? fmtL(currentValue) : '—'}</div></div>
            <div className="stat-card"><div className="stat-label">Unrealised P&amp;L</div>
              <div className={`stat-value ${unrealPnL>=0?'up':'dn'}`}>{pricesLoaded && holdings.length ? sign(unrealPnL)+fmtL(unrealPnL) : '—'}</div>
            </div>
            <div className="stat-card"><div className="stat-label">Realised P&amp;L</div>
              <div className={`stat-value ${realPnL>=0?'up':'dn'}`}>{realPnL!==0 ? sign(realPnL)+fmtL(realPnL) : '₹0.00'}</div>
            </div>
            <div className="stat-card" style={{borderColor: budget<10000?'rgba(240,84,84,0.3)':'var(--border)'}}>
              <div className="stat-label">Available Balance</div>
              <div className={`stat-value ${budget>=10000?'up':'dn'}`}>{fmtL(budget)}</div>
            </div>
          </div>

          {holdings.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">📈</div>
              <h3>Your portfolio is empty</h3>
              <p>Start building your Indian stock portfolio. Buy NSE stocks, track live prices, and monitor your P&amp;L in real time. All data persists in your browser.</p>
              <button className="btn-primary" onClick={onBuy}>Buy Your First Stock →</button>
            </div>
          ) : (
            <div className="card">
              <div className="card-header">
                <div className="card-title">Top Holdings</div>
                <button className="link-btn" onClick={()=>setView('holdings')}>View all {holdings.length} →</button>
              </div>
              <div className="table-wrap">
                <table className="table">
                  <thead><tr>
                    <th>Stock</th><th className="right">Qty</th><th className="right">Avg Buy</th>
                    <th className="right">LTP</th><th className="right">Value</th><th className="right">P&amp;L</th><th>Allocation</th>
                  </tr></thead>
                  <tbody>
                    {top.map(h=>(
                      <tr key={h.symbol}>
                        <td><div className="stock-cell clickable-stock" onClick={()=>onOpenChart(h)} title="Click to view price chart">
                          <div className="stock-badge">{h.ds.slice(0,4)}</div>
                          <div>
                            <div className="stock-name" style={{display:'flex',alignItems:'center',gap:'6px'}}>
                              {h.ds} <span style={{fontSize:'10px',color:'var(--gold)'}}>📈</span>
                            </div>
                            <div className="stock-sub">{h.name}</div>
                          </div>
                        </div></td>
                        <td className="right mono">{h.qty}</td>
                        <td className="right mono">{fmt(h.avgBuy)}</td>
                        <td className="right mono">{pricesLoaded && h.cp !== null ? fmt(h.cp) : '—'}</td>
                        <td className="right mono">{pricesLoaded && h.cv !== null ? fmtL(h.cv) : '—'}</td>
                        <td className={`right mono ${h.pnl>=0?'up':'dn'}`}>
                          {pricesLoaded && h.pnl !== null ? sign(h.pnl)+fmt(h.pnl) : '—'}
                          <div className="pct-small">{pricesLoaded && h.pnlPct !== null ? fmtPct(h.pnlPct) : ''}</div>
                        </td>
                        <td style={{minWidth:'100px'}}>
                          <div style={{fontSize:'10px',color:'var(--muted)',fontFamily:'IBM Plex Mono',marginBottom:'4px'}}>{h.cv !== null ? ((h.cv/totalCV)*100).toFixed(1) : 0}%</div>
                          <div className="alloc-bar"><div className="alloc-fill" style={{width:`${h.cv !== null ? (h.cv/totalCV)*100 : 0}%`}}/></div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ─── HOLDINGS VIEW ─── */
    function HoldingsView({ holdings, prices, pricesLoaded, onBuy, onBuyMore, onSell, onOpenChart }) {
      const enriched = holdings.map(h => {
        const cp = prices[h.symbol]?.price ?? null;
        const cv = cp !== null ? h.qty * cp : null;
        const pnl = cp !== null ? h.qty * (cp - h.avgBuy) : null;
        const pnlPct = cp !== null ? (cp - h.avgBuy) / h.avgBuy * 100 : null;
        return { ...h, cp, chgPct: prices[h.symbol]?.pct ?? null, cv, invested: h.qty*h.avgBuy, pnl, pnlPct };
      }).sort((a,b)=>(b.cv||0)-(a.cv||0));

      if (!holdings.length)
        return <div className="section"><div className="empty-state"><div className="empty-icon">📊</div><h3>No holdings yet</h3><p>Buy stocks to start building your portfolio.</p><button className="btn-primary" onClick={onBuy}>+ Buy Stock</button></div></div>;

      const totalInvested = enriched.reduce((a,h)=>a+h.invested,0);
      const totalValue    = enriched.reduce((a,h)=>a+(h.cv||h.invested),0);
      const totalPnL      = enriched.reduce((a,h)=>a+(h.pnl||0),0);

      return (
        <div className="section">
          <div className="section-header">
            <div><div className="section-tag">// MY HOLDINGS</div><h2>{holdings.length} Position{holdings.length!==1?'s':''}</h2></div>
            <button className="btn-primary" onClick={onBuy}>+ Buy Stock</button>
          </div>
          <div className="card">
            <div className="table-wrap">
              <table className="table">
                <thead><tr>
                  <th>Company</th><th className="right">Qty</th><th className="right">Avg Buy</th>
                  <th className="right">LTP</th><th className="right">Today</th>
                  <th className="right">Value</th><th className="right">Invested</th>
                  <th className="right">P&amp;L</th><th className="right">P&amp;L %</th><th></th>
                </tr></thead>
                <tbody>
                  {enriched.map(h=>(
                    <tr key={h.symbol}>
                      <td><div className="stock-cell clickable-stock" onClick={()=>onOpenChart(h)} title="Click to view price chart">
                        <div className="stock-badge">{h.ds.slice(0,4)}</div>
                        <div><div className="stock-name">{h.ds}</div><div className="stock-sub">{h.name}</div><div className="stock-sector">{h.sector}</div></div>
                      </div></td>
                      <td className="right mono">{h.qty}</td>
                      <td className="right mono">{fmt(h.avgBuy)}</td>
                      <td className="right mono">{pricesLoaded && h.cp !== null ? fmt(h.cp) : '—'}</td>
                      <td className={`right mono ${h.chgPct>=0?'up':'dn'}`}>{pricesLoaded && h.chgPct !== null ? fmtPct(h.chgPct) : '—'}</td>
                      <td className="right mono">{pricesLoaded && h.cv !== null ? fmtL(h.cv) : '—'}</td>
                      <td className="right mono">{fmtL(h.invested)}</td>
                      <td className={`right mono ${h.pnl>=0?'up':'dn'}`}>{pricesLoaded && h.pnl !== null ? sign(h.pnl)+fmt(h.pnl) : '—'}</td>
                      <td className={`right mono ${h.pnlPct>=0?'up':'dn'}`}>{pricesLoaded && h.pnlPct !== null ? fmtPct(h.pnlPct) : '—'}</td>
                      <td style={{whiteSpace:'nowrap'}}>
                        <button className="btn-chart-row" onClick={()=>onOpenChart(h)} title="View price chart">Chart</button>
                        <button className="btn-buy-more" onClick={()=>onBuyMore(h)}>Buy+</button>
                        <button className="btn-sell-row" onClick={()=>onSell(h)}>Sell</button>
                      </td>
                    </tr>
                  ))}
                  {pricesLoaded && (
                    <tr style={{background:'rgba(255,255,255,0.02)'}}>
                      <td colSpan={6} style={{fontWeight:700,fontSize:'13px',padding:'13px 16px',color:'var(--muted)',fontFamily:'IBM Plex Mono'}}>TOTAL</td>
                      <td className="right mono" style={{fontWeight:600}}>{fmtL(totalInvested)}</td>
                      <td className={`right mono ${totalPnL>=0?'up':'dn'}`} style={{fontWeight:600}}>{sign(totalPnL)}{fmtL(totalPnL)}</td>
                      <td className={`right mono ${totalPnL>=0?'up':'dn'}`} style={{fontWeight:600}}>{fmtPct(totalInvested>0?(totalPnL/totalInvested)*100:0)}</td>
                      <td/>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    /* ─── TRANSACTIONS VIEW ─── */
    function TransactionsView({ transactions, onClear }) {
      const sorted = [...transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
      const totalBought  = transactions.filter(t=>t.type==='BUY').reduce((a,t)=>a+t.total,0);
      const totalSold    = transactions.filter(t=>t.type==='SELL').reduce((a,t)=>a+t.total,0);
      const realPnL      = transactions.filter(t=>t.type==='SELL').reduce((a,t)=>a+(t.rPnL||0),0);
      const buyCount     = transactions.filter(t=>t.type==='BUY').length;
      const sellCount    = transactions.filter(t=>t.type==='SELL').length;

      if (!transactions.length)
        return <div className="section"><div className="empty-state"><div className="empty-icon">📜</div><h3>No transactions yet</h3><p>Your buy and sell history will appear here.</p></div></div>;

      return (
        <div className="section">
          <div className="section-header">
            <div><div className="section-tag">// TRANSACTION HISTORY</div><h2>{transactions.length} Trade{transactions.length!==1?'s':''}</h2></div>
            <button className="link-btn" style={{color:'var(--red)',fontSize:'12px'}} onClick={onClear}>Clear all</button>
          </div>
          <div className="stats-grid" style={{marginBottom:'20px'}}>
            <div className="stat-card"><div className="stat-label">Total Bought ({buyCount})</div><div className="stat-value">{fmtL(totalBought)}</div></div>
            <div className="stat-card"><div className="stat-label">Total Sold ({sellCount})</div><div className="stat-value">{fmtL(totalSold)}</div></div>
            <div className="stat-card"><div className="stat-label">Realised P&amp;L</div><div className={`stat-value ${realPnL>=0?'up':'dn'}`}>{realPnL!==0?sign(realPnL)+fmtL(realPnL):'₹0.00'}</div></div>
            <div className="stat-card"><div className="stat-label">Total Trades</div><div className="stat-value">{transactions.length}</div></div>
          </div>
          <div className="card">
            <div className="table-wrap">
              <table className="table">
                <thead><tr>
                  <th>Date &amp; Time</th><th>Type</th><th>Stock</th>
                  <th className="right">Qty</th><th className="right">Price</th>
                  <th className="right">Total</th><th className="right">Realised P&amp;L</th>
                </tr></thead>
                <tbody>
                  {sorted.map(t=>(
                    <tr key={t.id}>
                      <td className="mono" style={{fontSize:'11px',color:'var(--muted)'}}>{fmtDt(t.date)}</td>
                      <td><span className={`type-badge ${t.type.toLowerCase()}`}>{t.type}</span></td>
                      <td><div className="stock-cell">
                        <div className="stock-badge sm">{t.ds.slice(0,4)}</div>
                        <div><div className="stock-name">{t.ds}</div><div className="stock-sub">{t.name}</div></div>
                      </div></td>
                      <td className="right mono">{t.qty}</td>
                      <td className="right mono">{fmt(t.price)}</td>
                      <td className="right mono">{fmtL(t.total)}</td>
                      <td className={`right mono ${t.type==='SELL'?(t.rPnL>=0?'up':'dn'):''}`}>
                        {t.type==='SELL' ? sign(t.rPnL)+fmt(t.rPnL) : '—'}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    /* ─── BUDGET VIEW ─── */
    function BudgetView({ budget, budgetLog, onTopUp, onSetBalance }) {
      const [topUpAmt, setTopUpAmt] = useState('');
      const [setAmt, setSetAmt] = useState('');
      const [topErr, setTopErr] = useState('');
      const [setErr, setSetErr] = useState('');
      const isLow = budget < 10000;

      const handleTopUp = () => {
        const n = parseFloat(topUpAmt);
        if (!n || n <= 0) return setTopErr('Enter a valid amount.');
        if (n > 1e8) return setTopErr('Amount too large.');
        onTopUp(n);
        setTopUpAmt('');
        setTopErr('');
      };

      const handleSet = () => {
        const n = parseFloat(setAmt);
        if (isNaN(n) || n < 0) return setSetErr('Enter a valid non-negative amount.');
        onSetBalance(n);
        setSetAmt('');
        setSetErr('');
      };

      const sorted = [...budgetLog].reverse();

      return (
        <div className="section">
          <div className="section-header">
            <div><div className="section-tag">// TRADING BUDGET</div><h2>My Wallet</h2></div>
          </div>

          <div className="budget-hero">
            <div>
              <div className="budget-balance-label">Available Balance</div>
              <div className={`budget-balance-value${isLow?' low':''}`}>{fmtL(budget)}</div>
              <div className="budget-balance-sub">
                {isLow ? '⚠ Low balance — consider adding funds' : '✦ Funds available for trading'}

    /* ─── BUY MODAL ─── */
    
    /* Request search data from local Python backend */
    async function searchSymbols(query) {
      try {
        const res = await fetch(`http://localhost:3000/api/search?q=${encodeURIComponent(query)}`);
        if (!res.ok) return [];
        const json = await res.json();
        const quotes = json?.quotes || [];
        
        // Filter to mostly Indian exchanges, though Yahoo search can be noisy
        return quotes
          .filter(q => q.symbol && (q.exchDisp === 'NSE' || q.exchDisp === 'BSE' || q.symbol.endsWith('.NS') || q.symbol.endsWith('.BO')))
          .map(q => ({
            symbol: q.symbol,
            ds: q.symbol.replace(/\.(NS|BO)$/, ''),
            name: q.longname || q.shortname || q.symbol,
            sector: q.sector || q.industryDisp || q.typeDisp || 'Equity',
            exchange: q.exchDisp || 'NSE',
          }));
      } catch (e) {
        console.warn('Search API failed:', e);
        return [];
      }
    }

    function BuyModal({ onClose, onBuy, prices, setPrices, preselect, budget, onOpenChart }) {
      const [search, setSearch]       = useState('');
      const [sel, setSel]             = useState(preselect || null);
      const [qty, setQty]             = useState('');
      const [price, setPrice]         = useState('');
      const [err, setErr]             = useState('');
      const [results, setResults]     = useState([]);
      const [searching, setSearching] = useState(false);
      const [searchErr, setSearchErr] = useState(false);
      const debounceRef               = React.useRef(null);

      useEffect(() => {
        if (preselect) {
          const ltp = prices[preselect.symbol]?.price;
          if (ltp != null) {
            setPrice(ltp.toFixed(2));
          } else {
            fetchPrices([preselect.symbol]).then(res => {
              const live = res[preselect.symbol];
              if (live && live.price != null) {
                setPrice(live.price.toFixed(2));
                if (setPrices) setPrices(prev => ({ ...prev, [preselect.symbol]: live }));
              }
            }).catch(console.warn);
          }
        }
      }, []);

      // Trigger debounced fetch to Python backend
      useEffect(() => {
        if (!search.trim()) { setResults([]); setSearchErr(false); return; }
        
        clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(async () => {
          setSearching(true); setSearchErr(false);
          try {
            const r = await searchSymbols(search);
            setResults(r);
            if (r.length === 0) setSearchErr(true);
          } catch { 
            setSearchErr(true); 
          }
          setSearching(false);
        }, 500); // 500ms debounce
        
        return () => clearTimeout(debounceRef.current);
      }, [search]);

      const handleSelect = async (stock) => {
        setSel(stock); setSearch(''); setResults([]); setSearchErr(false);
        setErr('');

        // If price is already cached, set it immediately
        const ltp = prices[stock.symbol]?.price;
        if (ltp != null) {
          setPrice(ltp.toFixed(2));
          return;
        }

        // Otherwise fetch live price on-the-fly for newly searched stocks
        try {
          const res = await fetchPrices([stock.symbol]);
          const live = res[stock.symbol];
          if (live && live.price != null) {
            setPrice(live.price.toFixed(2));
            if (setPrices) {
              setPrices(prev => ({ ...prev, [stock.symbol]: live }));
            }
          }
        } catch (e) {
          console.warn('Failed to fetch live price for selected stock:', e);
        }
      };

      const qn = parseInt(qty) || 0, pn = parseFloat(price) || 0;

      const handleBuy = () => {
        if (!sel)         return setErr('Please select a stock.');
        if (!qn || qn<=0) return setErr('Enter a valid quantity (whole number).');
        if (!pn || pn<=0) return setErr('Enter a valid buy price.');
        const total = qn * pn;
        if (total > budget) return setErr(`Insufficient balance. You need ${fmtL(total)} but have ${fmtL(budget)}. Add funds in the Budget tab.`);
        onBuy({ symbol: sel.symbol, ds: sel.ds, name: sel.name, sector: sel.sector, qty: qn, price: pn });
        onClose();
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">{preselect ? `Buy More · ${preselect.ds}` : 'Buy Stock'}</div>

            {!sel ? (
              <>
                <div style={{position:'relative'}}>
                  <input
                    className="modal-input"
                    placeholder="Type to search Yahoo Finance for NSE/BSE stocks..."
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    autoFocus
                    style={{paddingRight: searching ? '36px' : '14px'}}
                  />
                  {searching && (
                    <span style={{position:'absolute',right:'12px',top:'50%',transform:'translateY(-50%)',
                      fontFamily:'IBM Plex Mono',fontSize:'11px',color:'var(--gold)',animation:'blink 1s infinite'}}>
                      ◆
                    </span>
                  )}
                </div>

                {!search.trim() && (
                  <div style={{fontSize:'12px',color:'var(--muted)', padding:'20px 0', textAlign:'center'}}>
                    Search any Indian stock by company name or ticker symbol to add it to your portfolio.
                  </div>
                )}
                
                {search.trim() && !searching && results.length === 0 && !searchErr && (
                  <div style={{fontSize:'10px',color:'var(--muted)',fontFamily:'IBM Plex Mono',
                    letterSpacing:'1.5px',textTransform:'uppercase',padding:'6px 2px 4px'}}>
                    ─ Search results
                  </div>
                )}
                
                {search.trim() && !searching && results.length > 0 && (
                  <div style={{fontSize:'10px',color:'var(--muted)',fontFamily:'IBM Plex Mono',
                    letterSpacing:'1.5px',textTransform:'uppercase',padding:'6px 2px 4px'}}>
                    ─ {results.length} result{results.length !== 1 ? 's' : ''} from Yahoo Finance
                  </div>
                )}

                {searchErr && !searching && (
                  <div style={{fontSize:'12px',color:'var(--red)',background:'var(--red-dim)',
                    border:'1px solid rgba(240,84,84,0.2)',borderRadius:'8px',padding:'9px 13px',marginBottom:'8px'}}>
                    No results found for "{search}" on Yahoo Finance. Try a different name or symbol.
                  </div>
                )}

                <div className="stock-list">
                  {results.map(stock => (
                    <div key={stock.symbol} className="stock-list-item" onClick={() => handleSelect(stock)}>
                      <div className="stock-badge sm">{stock.ds.slice(0,5)}</div>
                      <div className="sli-info">
                        <div className="stock-name">{stock.ds}
                          {stock.exchange && <span style={{fontSize:'9px',color:'var(--muted)',fontFamily:'IBM Plex Mono',marginLeft:'6px',background:'rgba(255,255,255,0.06)',padding:'1px 5px',borderRadius:'3px'}}>{stock.exchange}</span>}
                        </div>
                        <div className="stock-sub">{stock.name}{stock.sector && stock.sector !== 'Equity' ? ` · ${stock.sector}` : ''}</div>
                      </div>
                      <div className="sli-price">
                        <div className="mono" style={{fontSize:'13px', color:'var(--muted)'}}>
                          + Add
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <>
                <div className="selected-stock">
                  <div className="stock-badge lg">{sel.ds.slice(0,5)}</div>
                  <div>
                    <div className="stock-name">{sel.ds}
                      {sel.exchange && <span style={{fontSize:'9px',color:'var(--muted)',fontFamily:'IBM Plex Mono',marginLeft:'8px',background:'rgba(255,255,255,0.06)',padding:'2px 6px',borderRadius:'3px'}}>{sel.exchange}</span>}
                    </div>
                    <div className="stock-sub">{sel.name}{sel.sector && sel.sector !== 'Equity' ? ` · ${sel.sector}` : ''}</div>
                    {prices[sel.symbol] && prices[sel.symbol].price !== null && (
                      <div className={`ltp-line ${prices[sel.symbol].pct >= 0 ? 'up' : 'dn'}`}>
                        LTP {fmt(prices[sel.symbol].price)} ({fmtPct(prices[sel.symbol].pct)})
                      </div>
                    )}
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                    {onOpenChart && (
                      <button type="button" className="link-btn" onClick={() => onOpenChart(sel)} style={{display:'flex',alignItems:'center',gap:'4px'}}>
                        📈 Chart
                      </button>
                    )}
                    {!preselect && (
                      <button className="link-btn" onClick={() => { setSel(null); setPrice(''); setQty(''); setErr(''); }}>
                        Change
                      </button>

                  </div>
                </div>
                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">Quantity (shares)</label>
                    <input className="modal-input" type="number" min="1" step="1" placeholder="e.g. 10"
                      value={qty} onChange={e => setQty(e.target.value)} autoFocus={!!preselect}/>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Buy Price (₹)</label>
                    <input className="modal-input" type="number" step="0.05" min="0.01"
                      placeholder={prices[sel.symbol] && prices[sel.symbol].price ? `LTP: ${fmt(prices[sel.symbol].price)}` : 'Enter price'}
                      value={price} onChange={e => setPrice(e.target.value)}/>
                  </div>
                </div>
                {qn > 0 && pn > 0 && (
                  <>
                    <div className="order-summary">
                      <span style={{color:'var(--muted)',fontSize:'13px'}}>Total Investment</span>

    /* ─── SELL MODAL ─── */
    function SellModal({ holding, prices, onClose, onSell, budget }) {
      const ltp = prices[holding.symbol]?.price ?? holding.avgBuy;
      const [qty, setQty] = useState('');
      const [price, setPrice] = useState(ltp !== null ? ltp.toFixed(2) : '');
      const [err, setErr] = useState('');

      const qn = parseInt(qty)||0, pn = parseFloat(price)||0;
      const rPnL = qn*(pn - holding.avgBuy);
      const pnlPct = holding.avgBuy>0 ? (pn-holding.avgBuy)/holding.avgBuy*100 : 0;

      const handleSell = () => {
        if (!qn||qn<=0) return setErr('Enter a valid quantity.');
        if (qn > holding.qty) return setErr(`You only hold ${holding.qty} shares.`);
        if (!pn||pn<=0) return setErr('Enter a valid sell price.');
        onSell({ holding, qty: qn, price: pn });
        onClose();
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e=>e.stopPropagation()}>

              <div className="modal-title">Sell · {holding.ds}</div>

              <div>
                <div className="stock-name">{holding.ds} — {holding.name}</div>
